<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My DDL Wall 📌</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Kalam:wght@300;400;700&family=Noto+Sans+SC:wght@400;700&family=Patrick+Hand&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="lang-switch">
        <button class="lang-btn" onclick="toggleLanguage()">
            <span id="langText">English</span>
        </button>
    </div>

    <div class="container">

        <div class="header">
            <div class="title-container">
                <h1 id="mainTitle">My DDL Wall</h1>
                <div class="title-underline"></div>
            </div>
            <p id="subtitle">Stay focused, stay creative.</p>
        </div>
        <button class="floating-add-btn show" id="floatingBtn" onclick="toggleAddNote()">
            <span id="addIcon">➕</span>
        </button>

        <div class="filter-section">
            <button class="filter-btn active" onclick="filterItems('all')" id="filterAll">
                <span class="material-symbols-outlined">grid_view</span> All
            </button>
            <button class="filter-btn" onclick="filterItems('ddl')" id="filterDdl">
                <span class="material-symbols-outlined">calendar_month</span> DDL
            </button>
            <button class="filter-btn" onclick="filterItems('note')" id="filterNote">
                <span class="material-symbols-outlined">sticky_note_2</span> Notes
            </button>
            <button class="filter-btn" onclick="filterItems('high')" id="filterHigh">
                <span class="material-symbols-outlined">bolt</span> Urgent
            </button>
            <button class="filter-btn sort-btn" onclick="sortNotes()" id="sortBtn">
                <span class="material-symbols-outlined">auto_awesome_mosaic</span> <span id="sortText">Sort</span>
            </button>
            <button class="filter-btn" onclick="document.getElementById('icsFileInput').click()" id="importIcsBtn">
                <span class="material-symbols-outlined">upload_file</span> <span id="importIcsText">Import ICS</span>
            </button>
            <input type="file" id="icsFileInput" accept=".ics" style="display:none" onchange="handleICSImport(event)">
        </div>

        <div id="notesContainer" class="notes-container">
        </div>

        <div id="emptyState" class="empty-state">
            <div class="empty-state-icon">📭</div>
            <h2 id="emptyTitle">墙上还空空如也</h2>
            <p id="emptyText">点击右下角按钮添加第一个便签吧！</p>
        </div>
    </div>

    <div id="todoPanel" class="todo-panel">
        <button class="todo-toggle" onclick="toggleTodoPanel()">
            <span id="todoToggleIcon">📋</span>
            <span class="todo-toggle-text">Project TODOs</span>
        </button>
        <div class="todo-content">
            <h3>🚀 Project Milestones</h3>
            <textarea id="specialTodoInput" placeholder="Write your project tasks here... [ ] for task"
                oninput="saveSpecialTodos()">
            </textarea>
            <p>
            <ul>
                <li>Allow expand each task to whole page, and add notes inside</li>
                <li>Disable dragging out of screen</li>
                </p>
                <!-- add a list of dummy tasks -->

                <div id="specialTodoList" class="special-todo-list"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
